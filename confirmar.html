<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Página privada de cada cita (llega por el enlace del recordatorio): ni buscadores ni el enlace a otras webs -->
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Tu cita – Begoña Granero</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='-60 -60 120 120'%3E%3Crect x='-60' y='-60' width='120' height='120' rx='22' fill='%231F2A3C'/%3E%3Cg fill='none' stroke='%23D9BF86' stroke-width='5'%3E%3Cpolygon points='0,-48 41.6,-24 41.6,24 0,48 -41.6,24 -41.6,-24'/%3E%3Ccircle r='24'/%3E%3Ccircle cy='-24' r='24'/%3E%3Ccircle cy='24' r='24'/%3E%3C/g%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --rose: #D4A5A5; --rose-deep: #B8827F; --gold: #C9A96E; --gold-light: #E8D5B0;
    --cream: #FAF7F4; --cream-dark: #F2EDE8; --charcoal: #2C2C2C; --mid: #6B6B6B;
    --white: #FFFFFF; --error: #C0504D; --success: #6B9E7A;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Lato', sans-serif; background: var(--cream); color: var(--charcoal); min-height: 100vh;
         display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
  main { width: 100%; max-width: 440px; text-align: center; }
  .logo { width: 64px; height: 64px; color: var(--gold); margin: 0 auto 10px; display: block; }
  .marca { font-family: 'Playfair Display', serif; font-size: 1.35rem; }
  .marca small { display: block; font-family: 'Lato', sans-serif; font-size: 0.7rem; letter-spacing: 0.25em;
                 text-transform: uppercase; color: var(--mid); margin-top: 2px; }
  .tarjeta { background: var(--white); border: 1px solid var(--gold-light); border-radius: 6px; padding: 28px 22px; margin-top: 24px; }
  h1 { font-family: 'Playfair Display', serif; font-weight: 400; font-size: 1.6rem; margin-bottom: 14px; }
  .cita { background: var(--cream); border-radius: 4px; padding: 16px; margin: 16px 0 22px; line-height: 1.6; }
  .cita strong { font-size: 1.15rem; }
  .estado { display: inline-block; margin-top: 8px; padding: 4px 12px; border-radius: 20px; font-size: 0.85rem; font-weight: 700; }
  .estado.confirmada { background: #E7F1EA; color: var(--success); }
  .estado.cancelada  { background: #F7E4E3; color: var(--error); }
  .estado.pendiente  { background: var(--cream-dark); color: var(--mid); }
  button { display: block; width: 100%; font: 700 1.05rem 'Lato', sans-serif; letter-spacing: 0.05em; padding: 18px;
           border-radius: 4px; cursor: pointer; margin-top: 12px; border: 2px solid var(--rose-deep); }
  .si { background: var(--rose-deep); color: var(--white); }
  .no { background: var(--white); color: var(--rose-deep); }
  .peligro { background: var(--error); border-color: var(--error); color: var(--white); }
  button:disabled { opacity: 0.6; cursor: wait; }
  p { color: var(--mid); line-height: 1.6; }
  .ok { font-size: 2.6rem; margin-bottom: 6px; }
  .pie { margin-top: 22px; font-size: 0.9rem; }
  .pie a { color: var(--rose-deep); font-weight: 700; text-decoration: none; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <svg class="logo" viewBox="-54 -54 108 108" aria-hidden="true">
    <defs><clipPath id="c"><polygon points="0,-50 43.3,-25 43.3,25 0,50 -43.3,25 -43.3,-25"/></clipPath></defs>
    <g fill="none" stroke="currentColor" stroke-width="1.6">
      <polygon points="0,-50 43.3,-25 43.3,25 0,50 -43.3,25 -43.3,-25" stroke-width="2.4"/>
      <g clip-path="url(#c)">
        <circle r="25"/><circle cy="-25" r="25"/><circle cx="21.65" cy="-12.5" r="25"/><circle cx="21.65" cy="12.5" r="25"/>
        <circle cy="25" r="25"/><circle cx="-21.65" cy="12.5" r="25"/><circle cx="-21.65" cy="-12.5" r="25"/>
      </g>
      <path d="M0,-50 V50 M-43.3,-25 L43.3,25 M-43.3,25 L43.3,-25" stroke-width="1"/>
    </g>
  </svg>
  <div class="marca">Begoña Granero<small>Boutique de Belleza</small></div>

  <div class="tarjeta">
    <!-- Cargando -->
    <div id="v-cargando"><p>Cargando tu cita…</p></div>

    <!-- La cita, con los botones -->
    <div id="v-cita" hidden>
      <h1 id="saludo"></h1>
      <div class="cita">
        <strong id="cuando"></strong><br>
        <span id="servicios"></span><br>
        <span id="estado" class="estado"></span>
      </div>
      <div id="botones">
        <button class="si" id="b-si">CONFIRMO QUE VOY</button>
        <button class="no" id="b-no">NO PUEDO IR</button>
      </div>
      <div id="seguro" hidden>
        <p>¿Seguro que quieres cancelar la cita? Su hueco quedará libre para otra persona.</p>
        <button class="peligro" id="b-cancelar">SÍ, CANCELAR LA CITA</button>
        <button class="no" id="b-volver">VOLVER</button>
      </div>
      <p id="cerrada" hidden></p>
    </div>

    <!-- Respondido -->
    <div id="v-hecho" hidden>
      <div class="ok" id="hecho-icono"></div>
      <h1 id="hecho-titulo"></h1>
      <p id="hecho-texto"></p>
    </div>

    <!-- Error -->
    <div id="v-error" hidden>
      <h1>Vaya…</h1>
      <p id="error-texto"></p>
    </div>
  </div>

  <p class="pie">¿Quieres cambiar algo? Llámanos o escríbenos al <a href="tel:+34665085053">665 08 50 53</a></p>
</main>

<script>
// Llega por el enlace del recordatorio de WhatsApp: confirmar.html?c=<código secreto de la cita>.
// Con ese código Supabase solo enseña el nombre de pila, el día, la hora y los servicios, y deja confirmar o
// cancelar (reglas en el repositorio de la app: supabase/esquema.sql, ver_confirmacion y responder_confirmacion).
const SUPABASE_URL = 'https://jazzbriexlsmmotuxzit.supabase.co';
const SUPABASE_KEY = 'sb_publishable_KzFizhKF6XEmbGk3l7zLcw_BZO0Br0K';
const token = new URLSearchParams(location.search).get('c') || '';
const $ = id => document.getElementById(id);

async function rpc(funcion, parametros) {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${funcion}`, {
    method: 'POST',
    headers: { apikey: SUPABASE_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify(parametros),
  });
  if (!r.ok) throw new Error(`Supabase ${r.status}`);
  return r.json();
}

function ver(vista) {
  for (const v of ['v-cargando', 'v-cita', 'v-hecho', 'v-error']) $(v).hidden = v !== vista;
}

function error(texto) { $('error-texto').textContent = texto; ver('v-error'); }

const ESTADOS = { pendiente: 'Pendiente de confirmar', confirmada: '✓ Confirmada', cancelada: 'Cancelada' };

function pintar(c) {
  const fecha = new Date(c.fecha + 'T12:00:00');
  let dia = fecha.toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' });
  dia = dia.charAt(0).toUpperCase() + dia.slice(1);
  $('saludo').textContent    = c.nombre ? `Hola, ${c.nombre}` : 'Tu cita';
  $('cuando').textContent    = `${dia} a las ${c.hora}`;
  $('servicios').textContent = c.servicios || '';
  $('estado').textContent    = ESTADOS[c.estado] || c.estado;
  $('estado').className      = 'estado ' + (ESTADOS[c.estado] ? c.estado : 'pendiente');

  $('botones').hidden = !c.abierta;
  $('seguro').hidden  = true;
  $('cerrada').hidden = c.abierta;
  $('b-si').hidden    = c.estado === 'confirmada';   // ya confirmada: solo queda poder cancelar
  if (!c.abierta)
    $('cerrada').textContent = c.estado === 'cancelada'
      ? 'Esta cita está cancelada. Si quieres venir, llámanos y te buscamos hueco.'
      : 'Esta cita ya no se puede cambiar desde aquí.';
  ver('v-cita');
}

async function cargar() {
  if (token.length < 20) return error('Este enlace no es válido. Comprueba que lo has abierto entero o llámanos.');
  try {
    const c = await rpc('ver_confirmacion', { p_token: token });
    if (!c.ok) return error('Este enlace ya no es válido. Llámanos y lo vemos.');
    pintar(c);
  } catch { error('No hemos podido cargar tu cita. Comprueba la conexión e inténtalo de nuevo en un momento.'); }
}

async function responder(respuesta) {
  for (const b of document.querySelectorAll('button')) b.disabled = true;
  try {
    const r = await rpc('responder_confirmacion', { p_token: token, p_respuesta: respuesta });
    if (!r.ok) return error(r.error || 'No se ha podido guardar. Llámanos, por favor.');
    if (r.estado === 'confirmada') {
      $('hecho-icono').textContent  = '✓';
      $('hecho-titulo').textContent = '¡Gracias! Te esperamos';
      $('hecho-texto').textContent  = `Tu cita del ${$('cuando').textContent.toLowerCase()} está confirmada.`;
    } else {
      $('hecho-icono').textContent  = '✕';
      $('hecho-titulo').textContent = 'Cita cancelada';
      $('hecho-texto').textContent  = 'Gracias por avisarnos. Cuando quieras volver, pide cita de nuevo.';
    }
    ver('v-hecho');
  } catch { error('No se ha podido guardar tu respuesta. Comprueba la conexión e inténtalo de nuevo.'); }
  finally { for (const b of document.querySelectorAll('button')) b.disabled = false; }
}

$('b-si').onclick       = () => responder('confirmar');
$('b-no').onclick       = () => { $('botones').hidden = true; $('seguro').hidden = false; };
$('b-volver').onclick   = () => { $('seguro').hidden = true; $('botones').hidden = false; };
$('b-cancelar').onclick = () => responder('cancelar');
cargar();
</script>
</body>
</html>
